# ============================================================================
#  Allsafe Cybersecurity — marketing site VirtualHost
#  Deploy to: /etc/apache2/sites-available/allsafe.conf
#  Enable:    sudo a2ensite allsafe && sudo systemctl reload apache2
#
#  This file covers the MARKETING SITE ONLY. Allsafe Range (the intentionally
#  vulnerable training app) has its own VirtualHost file so the two can be
#  enabled and disabled independently. Never merge them.
#
#  Required modules:
#    sudo a2enmod rewrite headers expires cgid
#    sudo a2enmod ssl          # only if serving HTTPS (recommended)
#  `cgid` is needed solely for the portal auth stub (ScriptAlias below). If you
#  replace the stub with a proxied Flask/Node backend, drop cgid and enable
#  proxy + proxy_http instead.
# ============================================================================

<VirtualHost *:80>
    ServerName   allsafe.local
    ServerAlias  www.allsafe.local
    ServerAdmin  webmaster@allsafe.local

    DocumentRoot /var/www/allsafe

    # ---- Uncomment once TLS is in place to force HTTPS ---------------------
    # RewriteEngine On
    # RewriteCond %{HTTPS} !=on
    # RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    # ---- Document root ------------------------------------------------------
    <Directory /var/www/allsafe>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Allow /services instead of /services.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME}.html -f
        RewriteRule ^([^/.]+)/?$ $1.html [L]

        DirectoryIndex index.html
    </Directory>

    # ---- Client portal ------------------------------------------------------
    # The portal is an isolated component: static assets here, auth behind the
    # ScriptAlias below.
    <Directory /var/www/allsafe/portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---- AUTH SEAM ----------------------------------------------------------
    # Today: a hardcoded-credential CGI stub returning a JSON verdict.
    ScriptAlias /portal/login /var/www/allsafe/portal/login.cgi

    <Files "login.cgi">
        Options +ExecCGI
        SetHandler cgi-script
        Require all granted
    </Files>

    # Tomorrow, pick ONE of these instead and comment out the ScriptAlias.
    # The front end changes only in portal/auth-config.js.
    #
    # (a) Small Flask/Node service doing the LDAP bind against allsafe.local:
    #     a2enmod proxy proxy_http
    #     ProxyPreserveHost On
    #     ProxyPass        /portal/login http://127.0.0.1:8081/login
    #     ProxyPassReverse /portal/login http://127.0.0.1:8081/login
    #
    # (b) Apache-native LDAP auth (a2enmod authnz_ldap ldap), pointing
    #     auth-config.js `endpoint` at /portal/session:
    #     <Location /portal/session>
    #         AuthType Basic
    #         AuthName "Allsafe Client Portal"
    #         AuthBasicProvider ldap
    #         AuthLDAPURL "ldaps://dc01.allsafe.local/DC=allsafe,DC=local?sAMAccountName?sub?(objectClass=user)"
    #         AuthLDAPBindDN "CN=svc_portal,OU=Service Accounts,DC=allsafe,DC=local"
    #         AuthLDAPBindPassword "exec:/usr/local/bin/portal-bind-pw"
    #         Require ldap-group CN=Portal Users,OU=Groups,DC=allsafe,DC=local
    #     </Location>

    # ---- Never serve source or docs from the web root -----------------------
    <FilesMatch "\.(md|conf|service|sample|bak)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # ---- Caching -------------------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                "access plus 7 days"
        ExpiresByType application/javascript  "access plus 7 days"
        ExpiresByType image/svg+xml           "access plus 30 days"
        ExpiresByType text/html               "access plus 0 seconds"
    </IfModule>

    # ---- Baseline response headers -------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # Google Fonts is the only external origin this site uses.
        Header always set Content-Security-Policy "default-src 'self'; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; script-src 'self' 'unsafe-inline'; \
connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
        Header unset X-Powered-By
    </IfModule>

    ServerTokens Prod
    ServerSignature Off

    # ---- Logging (Wazuh should ingest both of these) --------------------------
    ErrorLog  ${APACHE_LOG_DIR}/allsafe_error.log
    CustomLog ${APACHE_LOG_DIR}/allsafe_access.log combined
    LogLevel  warn
</VirtualHost>


