{% extends "base.html" %}
{% block title %}A07 login — Allsafe Range{% endblock %}
{% block crumb %}<p class="crumb"><a href="{{ url_for('a07.home') }}">&larr; A07</a></p>{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <p class="sub">Unlimited attempts. Seeded accounts: <code>admin/admin</code>, <code>j.ellis/Password1</code>.</p>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="u">Username</label>
    <input type="text" id="u" name="username" value="{{ username }}" autocomplete="off">
    <label for="p">Password</label>
    <input type="password" id="p" name="password" autocomplete="off">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
