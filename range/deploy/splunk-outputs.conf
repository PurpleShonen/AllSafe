# ============================================================================
#  Splunk Universal Forwarder — forwarding target
#  Install to: /opt/splunkforwarder/etc/system/local/outputs.conf
#
#  SPLUNK01 sits on the same SOC-LAB vSwitch as WEB01, so this is a plain
#  internal connection — no tunnel required.
# ============================================================================
[tcpout]
defaultGroup = soclab_indexers

[tcpout:soclab_indexers]
server = splunk01.allsafe.local:9997
# Use the IP instead if DC01 is not yet serving DNS for the lab.

# Recommended once you have a lab CA or self-signed cert on the indexer:
# clientCert = /opt/splunkforwarder/etc/auth/client.pem
# sslVerifyServerCert = true
