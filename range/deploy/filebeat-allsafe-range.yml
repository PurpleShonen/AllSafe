# ============================================================================
#  Filebeat input for Allsafe Range — ships the app's JSON logs AND Apache's
#  own logs to an Elastic/OpenSearch or Wazuh collector.
#
#  ALTERNATIVE SHIPPER — NOT the default. This lab's SIEM is Splunk on
#  SPLUNK01; the default path is the Universal Forwarder (splunk-inputs.conf).
#  Use this file only if you are pointing the range at Elastic/OpenSearch or a
#  Wazuh manager instead. Run ONE shipper, not two, or you will double-index.
#
#  Merge these inputs into /etc/filebeat/filebeat.yml (or drop under
#  filebeat.inputs). Wazuh can alternatively ingest these paths directly via
#  the Wazuh agent's localfile config.
# ============================================================================
filebeat.inputs:

  # ---- App structured logs (already JSON, one object per line) -------------
  - type: filestream
    id: allsafe-range-app
    paths:
      - /var/log/allsafe-range/app.log
    parsers:
      - ndjson:
          target: ""                # promote fields to the top level
          add_error_key: true
          overwrite_keys: true
    fields:
      log_source: allsafe-range-app
    fields_under_root: true

  - type: filestream
    id: allsafe-range-access
    paths:
      - /var/log/allsafe-range/access.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true
    fields:
      log_source: allsafe-range-access
    fields_under_root: true

  # ---- Apache's own logs for the range vhost (edge view) -------------------
  - type: filestream
    id: allsafe-range-apache
    paths:
      - /var/log/apache2/range_access.log
      - /var/log/apache2/range_error.log
    fields:
      log_source: allsafe-range-apache
    fields_under_root: true

# Point at your collector's address on the SOC-LAB vSwitch.
output.logstash:
  hosts: ["collector.allsafe.local:5044"]

# Or, if you run OpenSearch directly:
# output.elasticsearch:
#   hosts: ["https://collector.allsafe.local:9200"]
