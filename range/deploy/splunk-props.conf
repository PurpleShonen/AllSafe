# ============================================================================
#  Splunk props.conf for the Allsafe Range sourcetypes
#
#  WHERE THIS GOES DEPENDS ON WHICH EXTRACTION MODE YOU PICK — this is the
#  usual Splunk footgun, so read the two options before copying.
#
#  Option 1 (default below, simplest): search-time JSON extraction.
#      - The [allsafe:range:*] stanzas go on the SEARCH HEAD / indexer
#        SPLUNK01: $SPLUNK_HOME/etc/system/local/props.conf
#      - Nothing extra goes on the UF.
#      - Fields are parsed at search time from KV_MODE = json.
#
#  Option 2: index-time JSON extraction.
#      - Replace `KV_MODE = json` with `INDEXED_EXTRACTIONS = json`, and put
#        the stanza on the FORWARDER (WEB01), not the indexer. INDEXED_EXTRACTIONS
#        is read by whichever instance first reads the file, which for a UF
#        monitor input is the UF itself.
#      - Costs index space; only worth it if you are accelerating on these fields.
#
#  Either way, the line-breaking and timestamp settings belong on the indexer.
# ============================================================================

[allsafe:range:app]
KV_MODE          = json
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%3NZ
TZ               = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
category         = Custom
description      = Allsafe Range — application security events (NDJSON)

[allsafe:range:access]
KV_MODE          = json
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT      = %Y-%m-%dT%H:%M:%S.%3NZ
TZ               = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
category         = Custom
description      = Allsafe Range — per-request access log (NDJSON)

# The `timestamp` field is emitted by allsafe_range/logging_setup.py as RFC3339
# UTC with milliseconds (2026-08-27T12:34:56.789Z). If you change the format
# there, change TIME_FORMAT here to match.
