# ============================================================================
#  Allsafe Range — Apache reverse-proxy VirtualHost
#  Deploy to: /etc/apache2/sites-available/range.allsafe.local.conf
#  Enable:    sudo a2ensite range.allsafe.local && sudo systemctl reload apache2
#
#  SEPARATE from the marketing site's vhost on purpose, so the vulnerable app
#  can be enabled/disabled on its own:
#      sudo a2dissite range.allsafe.local   # take the range offline instantly
#
#  Required modules:
#      sudo a2enmod proxy proxy_http headers
#      sudo a2enmod ssl      # if serving HTTPS
#
#  The Flask app listens on 127.0.0.1:8080 (systemd unit / gunicorn). Apache is
#  the only thing exposed to the network.
#
#  !! This fronts INTENTIONALLY VULNERABLE software. Only enable it on an
#     isolated lab VM. See README-WARNING.md. !!
# ============================================================================

<VirtualHost *:80>
    ServerName range.allsafe.local
    ServerAdmin webmaster@allsafe.local

    ProxyPreserveHost On
    ProxyRequests Off

    # Pass the real client IP through; the app reads X-Forwarded-For for its
    # structured access log (RANGE_TRUST_PROXY=1, the default).
    RemoteIPHeader X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    # Do NOT add a WAF or security headers that would blunt the training bugs.
    # The point is to let attacks through and observe them in the logs.

    # ---- Apache's own logs for THIS vhost ----------------------------------
    # Splunk should ingest these IN ADDITION to the app's JSON logs in
    # /var/log/allsafe-range/. Apache logs give you the view from the edge
    # (TLS, raw bytes, malformed requests the app never parses); the app logs
    # give you the parsed params and security events. You want both.
    ErrorLog  ${APACHE_LOG_DIR}/range_error.log
    CustomLog ${APACHE_LOG_DIR}/range_access.log combined
    LogLevel  info
</VirtualHost>

