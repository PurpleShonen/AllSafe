# ============================================================================
#  Splunk Universal Forwarder — inputs for Allsafe Range
#  Install to: /opt/splunkforwarder/etc/system/local/inputs.conf
#  Then:       sudo /opt/splunkforwarder/bin/splunk restart
#
#  This file covers the RANGE ONLY. The marketing site's Apache logs
#  (/var/log/apache2/allsafe_*.log) are listed in ../../site/README.md — if
#  both apps share WEB01, merge those stanzas into the same inputs.conf.
#
#  The index must already exist on SPLUNK01:
#    Settings > Indexes > New Index > allsafe_range
#  or in $SPLUNK_HOME/etc/system/local/indexes.conf on the indexer.
#
#  Forwarding target is set separately, in outputs.conf — see splunk-outputs.conf.
# ============================================================================

# ---- App structured logs (newline-delimited JSON, one object per line) ------
[monitor:///var/log/allsafe-range/app.log]
disabled       = false
index          = allsafe_range
sourcetype     = allsafe:range:app
# Security events worth alerting on. This is the high-signal file.

[monitor:///var/log/allsafe-range/access.log]
disabled       = false
index          = allsafe_range
sourcetype     = allsafe:range:access
# Every HTTP request, with parsed params and `suspected` tags.

# ---- Apache's own logs for the range vhost (the view from the edge) ---------
[monitor:///var/log/apache2/range_access.log]
disabled       = false
index          = allsafe_range
sourcetype     = access_combined

[monitor:///var/log/apache2/range_error.log]
disabled       = false
index          = allsafe_range
sourcetype     = apache_error

# Ingest BOTH the app logs and Apache's. Apache gives you raw bytes, TLS, and
# malformed requests the app never parses; the app logs give you parsed params
# and security events. Neither is a substitute for the other.
