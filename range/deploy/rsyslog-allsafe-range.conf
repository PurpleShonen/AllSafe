# ============================================================================
#  Alternative to Filebeat: tail the JSON logs with rsyslog's imfile and
#  forward over TCP to a collector on the SOC-LAB vSwitch.
#
#  ALTERNATIVE SHIPPER — NOT the default. This lab's SIEM is Splunk on
#  SPLUNK01; the default path is the Universal Forwarder (splunk-inputs.conf).
#  Run ONE shipper, not two. Never forward lab logs off the vSwitch in the
#  clear — wrap in stunnel if you ever do.
#  Install to: /etc/rsyslog.d/60-allsafe-range.conf  then: systemctl restart rsyslog
# ============================================================================
module(load="imfile")

input(type="imfile"
      File="/var/log/allsafe-range/app.log"
      Tag="allsafe-range-app:"
      Severity="info"
      Facility="local5")

input(type="imfile"
      File="/var/log/allsafe-range/access.log"
      Tag="allsafe-range-access:"
      Severity="info"
      Facility="local5")

# Forward local5 to the collector over TCP, on the vSwitch.
local5.* @@collector.allsafe.local:514
