# ============================================================================
#  Alternative to Filebeat: tail the JSON logs with rsyslog's imfile and
#  forward over TCP (wrap in a WireGuard tunnel or stunnel — do NOT send lab
#  logs across the internet in the clear).
#  Install to: /etc/rsyslog.d/60-allsafe-range.conf  then: systemctl restart rsyslog
# ============================================================================
module(load="imfile")

input(type="imfile"
      File="/var/log/allsafe-range/app.log"
      Tag="allsafe-range-app:"
      Severity="info"
      Facility="local5")

input(type="imfile"
      File="/var/log/allsafe-range/access.log"
      Tag="allsafe-range-access:"
      Severity="info"
      Facility="local5")

# Forward local5 to the home-lab collector over TCP (10.66.0.1 = WireGuard peer).
local5.* @@10.66.0.1:514
